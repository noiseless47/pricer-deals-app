[project]
name = "pricer"
version = "0.1.0"
description = "GPU-powered product price estimation and deal discovery"
readme = "README.md"
requires-python = ">=3.12.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "feedparser>=6.0.14",
    "greenlet>=3.5.4",
    "litellm>=1.95.0",
    "modal>=1.5.3",
    "numpy>=2.4.6",
    "openai>=2.53.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.6.1",
    "sqlmodel>=0.0.39",
    "torch>=2.13.0",
    "transformers>=4.57.2,<5.0.0",
    "peft>=0.18.0,<0.19.0",
    "accelerate>=1.14.0,<2.0.0",
    "uvicorn[standard]>=0.52.1",
    "websockets>=17.0.1",
]

[project.optional-dependencies]
data = [
    "datasets>=4.4.0,<5.0.0",
    "huggingface-hub>=0.34.0,<1.0.0",
    "tqdm>=4.70.0",
]
